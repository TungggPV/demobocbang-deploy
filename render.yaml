# Free demo stack for the Tunggg branch.
# Frontend is deployed separately from frontend/ on Vercel. PostgreSQL and
# private object storage are supplied by Neon Free. The API, Dramatiq worker,
# and reconciler intentionally share one Render Free web container.
envVarGroups:
  - name: bocbang-free-demo
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: QUEUE_BACKEND
        value: redis
      - key: WORKER_MAX_RETRIES
        value: "3"
      - key: WORKER_RETRY_MIN_BACKOFF_MS
        value: "10000"
      - key: WORKER_RETRY_MAX_BACKOFF_MS
        value: "60000"
      - key: WORKER_RECONCILE_INTERVAL_SECONDS
        value: "15"
      - key: WORKER_RECONCILE_BATCH_SIZE
        value: "100"
      - key: WORKER_DELIVERY_TIMEOUT_SECONDS
        value: "300"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_ATTACHMENT_MAX_BYTES
        value: "15000000"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION
        value: auto
      - key: STORAGE_PRESIGNED_URL_TTL_SECONDS
        value: "300"
      - key: STT_PROVIDER
        value: assemblyai
      - key: STT_API_KEY
        sync: false
      - key: STT_MODEL
        value: universal-3-5-pro
      - key: STT_FALLBACK_MODEL
        value: universal-2
      - key: ASSEMBLYAI_STREAMING_MODEL
        value: universal-3-6-pro
      - key: ASSEMBLYAI_STREAMING_MODE
        value: max_accuracy
      - key: ASSEMBLYAI_STREAMING_MIN_TURN_SILENCE_MS
        value: "560"
      - key: ASSEMBLYAI_STREAMING_MAX_TURN_SILENCE_MS
        value: "2000"
      - key: TRANSLATION_PROVIDER
        value: gemini
      - key: TRANSLATION_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: MAX_MEDIA_DURATION_SECONDS
        value: "3600"

services:
  - type: keyvalue
    name: bocbang-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: bocbang-api
    runtime: docker
    branch: Tunggg
    region: singapore
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python -m app.free_stack
    healthCheckPath: /api/v1/ready
    envVars:
      - fromGroup: bocbang-free-demo
      - key: REDIS_URL
        fromService:
          name: bocbang-redis
          type: keyvalue
          property: connectionString

